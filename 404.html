ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li a{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
li a span{font:12px "Geist Mono",monospace;color:var(--muted)}
