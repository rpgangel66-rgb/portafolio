<head>

<meta name="description" content="Demo de expediente clínico digital preparado para Lazer Medicina Estética.">
<meta name="robots" content="noindex,nofollow">

<meta property="og:title" content="Expediente digital · Lazer Medicina Estética">
<meta property="og:description" content="Demo preparado para Lazer: ficha clínica, consentimiento informado con firmas, control de sesiones y pagos. Sin papel.">

<style>
:root{
  color-scheme:light;
  --bg:#F6F4F0;--panel:#FFFFFF;--soft:#FAF8F5;--ink:#132D2B;--t2:#3F5856;--mut:#768885;--line:#E6E1D9;--line2:#EFEBE5;
  --teal:#1E6B67;--teal2:#14514E;--tealS:#E0EFEC;--teal3:#2E8A84;
  --pink:#D98A9C;--pinkS:#FBE8ED;--pinkI:#9E4A5E;
  --ok:#1E7B4F;--okS:#E3F3EA;--warn:#A85A08;--warnS:#FCEFDF;--bad:#B42318;--badS:#FDECEA;
  --r:16px;--ri:10px;--sh:0 1px 2px rgba(19,45,43,.04),0 10px 30px -14px rgba(19,45,43,.18);
  --f:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--m:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--m)}
:focus-visible{outline:2px solid var(--teal3);outline-offset:2px}
[hidden]{display:none!important}

/* barra de demo crusol */
.cbar{display:flex;align-items:center;gap:14px;background:#0b2a20;color:#f6f5f0;font:12px/1.3 "Geist Mono",ui-monospace,monospace;padding:7px 18px;flex-wrap:wrap}
.cbar b{font-weight:500;color:#a9c4b6;text-transform:uppercase;letter-spacing:.08em}
.cbar .r{margin-left:auto;color:rgba(246,245,240,.72);white-space:nowrap}
.cbar button{background:none;border:0;color:#f6f5f0;text-decoration:underline;text-underline-offset:3px;padding:0;font:inherit}
.cbar a{color:#f6f5f0}

/* cabecera */
.top{display:flex;align-items:center;gap:18px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;color:var(--teal);text-decoration:none;flex:none}
.logo .lz{font:700 30px/1 "Antonio",sans-serif;letter-spacing:.02em;position:relative;padding-top:4px}
.logo .lz::before{content:"";position:absolute;left:-2px;right:-2px;top:-1px;height:7px;border:2px solid currentColor;border-bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
.logo .me{font:600 12.5px/1.05 "Comfortaa",sans-serif;color:var(--teal3)}
.brsel{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 12px;background:var(--soft);font-size:13px;color:var(--t2)}
.brsel select{border:0;background:var(--panel);border-radius:999px;padding:5px 26px 5px 10px;font-weight:600;color:var(--ink);appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;background-size:5px 5px;background-repeat:no-repeat;box-shadow:0 0 0 1px var(--line)}
.srch{flex:1;max-width:380px;position:relative}
.srch input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:9px 14px 9px 36px}
.srch svg{position:absolute;left:12px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--mut)}
.role{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--t2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;box-shadow:0 2px 6px -2px rgba(20,81,78,.5)}

/* estructura */
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 110px)}
.nav{border-right:1px solid var(--line);padding:18px 12px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:12px;padding:10px 12px;text-align:left;font-weight:500;color:var(--t2)}
.nav button svg{width:18px;height:18px;flex:none}
.nav button[aria-current="page"]{background:var(--tealS);color:var(--teal2)}
.nav button:hover{background:var(--soft)}
.nav .sep{height:1px;background:var(--line);margin:10px 6px}
.nav .paper{margin-top:auto;border:1px dashed var(--line);border-radius:14px;padding:12px;font-size:12.5px;color:var(--t2);background:var(--soft)}
.nav .paper b{display:block;font:600 22px/1.1 var(--f);color:var(--teal);margin-bottom:2px}
main{padding:24px 28px 60px;min-width:0}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.ph p{margin:4px 0 0;color:var(--mut)}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.cap{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--ink);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:#cfc8bd}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal2)}
.btn.pri:disabled{background:#9DBCB9;border-color:#9DBCB9;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:transparent;background:none;color:var(--teal)}
.btn.pink{background:var(--pinkS);border-color:#F2CBD5;color:var(--pinkI)}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.ok{background:var(--okS);color:var(--ok)}
.chip.warn{background:var(--warnS);color:var(--warn)}
.chip.bad{background:var(--badS);color:var(--bad)}
.chip.mut{background:var(--line2);color:var(--t2)}
.chip.pk{background:var(--pinkS);color:var(--pinkI)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi small{display:block;color:var(--mut);font-size:12.5px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin:4px 0 2px;font-weight:600}
.kpi span{font-size:12.5px;color:var(--t2)}

/* lista de pacientes */
.fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fil button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--t2)}
.fil button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.plist{overflow:hidden}
.prow{display:grid;grid-template-columns:minmax(0,2.2fr) .7fr minmax(0,1.6fr) minmax(0,1.5fr) .9fr;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.prow:hover{background:var(--soft)}
.prow.hd{border-top:0;background:var(--soft);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;cursor:default;padding-top:10px;padding-bottom:10px}
.who{display:flex;align-items:center;gap:11px;min-width:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--tealS);color:var(--teal2);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mut);font-family:var(--m);font-size:12px}
.prow .tx{color:var(--t2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .st{display:flex;gap:5px;flex-wrap:wrap}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}

/* formularios */
.steps{display:flex;gap:6px;margin-bottom:18px;counter-reset:s;flex-wrap:wrap}
.steps li{list-style:none;flex:1;min-width:120px;border-top:3px solid var(--line);padding-top:8px;font-size:13px;color:var(--mut);font-weight:500}
.steps li.on{border-color:var(--teal);color:var(--ink)}
.steps li.done{border-color:var(--teal3);color:var(--t2)}
.steps{padding:0;margin-top:0}
.fbox{padding:22px 24px}
.fbox h2{margin:0 0 4px;font-size:19px}
.fbox>p.d{margin:0 0 18px;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--t2);grid-column:span 3;min-width:0}
.f.s2{grid-column:span 2}.f.s6{grid-column:span 6}.f.s4{grid-column:span 4}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:var(--ri);background:var(--panel);padding:10px 12px;font-weight:400;font-size:15px;color:var(--ink);width:100%}
.f textarea{resize:vertical;min-height:62px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal3);outline:none;box-shadow:0 0 0 3px rgba(46,138,132,.15)}
.f .err{border-color:var(--bad)!important;background:#FFF8F7}
.f .lb{display:flex;align-items:center;gap:8px}
.f .lb .pk{background:var(--pinkS);color:var(--pinkI);border-radius:4px;padding:1px 6px}
.f .ng{margin-left:auto;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;color:var(--t2)}
.f .ng:hover{border-color:var(--teal3);color:var(--teal)}
.f .ro{background:var(--soft)!important;color:var(--mut)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:500}
.pills button[aria-pressed="true"]{background:var(--tealS);border-color:var(--teal3);color:var(--teal2)}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--pinkS);border:1px solid #F2CBD5;color:var(--pinkI);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.rule svg{width:18px;height:18px;flex:none;margin-top:1px}
.hint{display:flex;gap:9px;align-items:flex-start;background:var(--tealS);color:var(--teal2);border-radius:12px;padding:10px 14px;font-size:13.5px}
.hint svg{width:17px;height:17px;flex:none;margin-top:1px}
.fnav{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px;border-top:1px solid var(--line2);flex-wrap:wrap}
.fnav .l{margin-right:auto}

/* firma */
.sig{border:1px dashed #CFC8BD;border-radius:12px;background:var(--soft);position:relative;height:150px;touch-action:none}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:12px;cursor:crosshair}
.sig .ph2{position:absolute;inset:0;display:grid;place-items:center;color:#B3AAA0;font-size:13px;pointer-events:none}
.sig .ln{position:absolute;left:18px;right:18px;bottom:34px;border-bottom:1px solid #D6CFC5;pointer-events:none}
.sig .clr{position:absolute;right:8px;top:8px;border:0;background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--t2);box-shadow:0 0 0 1px var(--line)}
.sig.err{border-color:var(--bad);background:#FFF8F7}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sigb .who2{display:flex;justify-content:space-between;align-items:center;min-height:30px;gap:8px;font-size:13px;font-weight:600;color:var(--t2);margin-bottom:6px}
.sigb .who2 input,.sigb .who2 select{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:500;width:62%;min-width:0}
.sigb small{display:block;margin-top:5px;color:var(--mut);font-size:12px}
.sigimg{height:56px;display:block}
.sigimg path{fill:none;stroke:#1b2b4b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* expediente */
.xhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 22px;margin-bottom:14px}
.xhead .av{width:58px;height:58px;font-size:19px}
.xhead h1{margin:0;font-size:24px;letter-spacing:-.02em}
.xhead .meta{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--t2);font-size:13.5px;margin-top:5px}
.xhead .meta b{font-weight:600;color:var(--ink)}
.xhead .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.xgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--teal2);border-color:var(--teal)}
.tabs button i{font-style:normal;background:var(--line2);color:var(--t2);border-radius:999px;padding:0 7px;font-size:11.5px}
.sec{padding:18px 20px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}
.sec h3 .act{margin-left:auto}
dl.kv{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:9px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--mut)}
dl.kv dd{margin:0;font-weight:500}
dl.kv dd.al{color:var(--bad);font-weight:600}
.lock{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--t2);background:var(--soft);font-size:13.5px}
.lock svg{width:22px;height:22px;color:var(--mut);flex:none}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.chk li:first-child{border-top:0}
.chk li .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk li .ic svg{width:13px;height:13px}
.chk li.y .ic{background:var(--okS);color:var(--ok)}
.chk li.n .ic{background:var(--warnS);color:var(--warn)}
.chk li small{display:block;color:var(--mut);font-size:12px}
.chk li>div{min-width:0;flex:1}.chk li button{margin-top:7px}

.doc{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line2)}
.doc:first-of-type{border-top:0}
.doc .di{width:40px;height:48px;border-radius:6px;background:var(--pinkS);color:var(--pinkI);display:grid;place-items:center;flex:none}
.doc .di svg{width:20px;height:20px}
.doc b{display:block}
.doc small{color:var(--mut);font-size:12.5px}
.doc .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.pkg{padding:16px 18px;margin-bottom:14px}
.pkg .ptop{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.pkg h4{margin:0;font-size:16px}
.pkg .ptop small{color:var(--mut)}
.bars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.bar small{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t2);margin-bottom:5px}
.bar small b{color:var(--ink)}
.bar .tr{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--teal);border-radius:99px}
.bar.p .tr i{background:var(--pink)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl td.num,.tbl td.mono{white-space:nowrap}
.tbl td.n{font-family:var(--m);color:var(--mut);width:28px}
.tbl tr.fut td{color:#B7AEA4}
.tbl .r{text-align:right}
.tbl .sigimg{height:30px}
.saldo{display:flex;justify-content:space-between;padding:10px 8px 0;font-weight:600}
.saldo span.b{color:var(--pinkI)}

.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.pcard .im{aspect-ratio:4/5;position:relative;background:linear-gradient(160deg,#EFE9E2,#E2D9CF);display:grid;place-items:center;overflow:hidden}
.pcard .im img{width:100%;height:100%;object-fit:cover}
.pcard .im svg.face{width:56%;height:auto;color:#C9BDB0}
.pcard .im .tg{position:absolute;left:10px;top:10px}
.pcard .ft{padding:9px 12px;font-size:12.5px;color:var(--t2);display:flex;justify-content:space-between;gap:8px}
.cmp{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#E8E1D8;user-select:none;touch-action:none}
.cmp .a,.cmp .b{position:absolute;inset:0;display:grid;place-items:center}
.cmp .b{clip-path:inset(0 0 0 50%)}
.cmp .hd2{position:absolute;top:0;bottom:0;left:50%;width:3px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.cmp .hd2::after{content:"";position:absolute;top:50%;left:50%;width:34px;height:34px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.2)}

.note{border-left:3px solid var(--teal3);padding:10px 14px;background:var(--soft);border-radius:0 12px 12px 0;margin-bottom:10px}
.note.fix{border-color:var(--pink)}
.note header{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:4px;flex-wrap:wrap}
.note header b{color:var(--ink);font-weight:600}
.note p{margin:0;font-size:14px}
.log{list-style:none;margin:0;padding:0;font-size:13.5px}
.log li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:8px 0;border-top:1px solid var(--line2)}
.log li:first-child{border-top:0}
.log time{color:var(--mut);font-family:var(--m);font-size:12px}
.log b{font-weight:600}

/* dirección */
.brt{width:100%;border-collapse:collapse;font-size:14px}
.brt th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line)}
.brt td{padding:11px 12px;border-bottom:1px solid var(--line2)}
.brt td.r,.brt th.r{text-align:right}
.brt .hb{display:flex;align-items:center;gap:10px}
.brt .hb i{display:block;width:calc(var(--w) * 1.2px);height:8px;background:var(--teal);border-radius:99px;min-width:2px}
.brt tr:last-child td{border-bottom:0}
