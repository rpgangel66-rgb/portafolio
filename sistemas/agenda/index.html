<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="canonical" href="https://crusol.com.mx/sistemas/agenda/">

<meta property="og:site_name" content="crusol">

<meta property="og:url" content="https://crusol.com.mx/sistemas/agenda/">
<meta property="og:title" content="Agenda de citas en línea · Demo de crusol">
<meta property="og:description" content="Tus clientes reservan solos desde el celular: confirmación por WhatsApp, recordatorios y cero empalmes. Pruébalo en vivo.">

<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F5F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== temas por giro ===== */
:root{
  color-scheme:light;
  --ok:#1E7B4F; --ok-soft:#E3F3EA; --warn:#B25E09; --warn-soft:#FCEFDF; --bad:#B42318; --bad-soft:#FDECEA;
  --cb:#0b2a20; --cb-t:#f6f5f0; --cb-s:#a9c4b6;
}
html[data-g="dental"]{
  --bg:#EDF4F3; --panel:#FFFFFF; --ink:#0E2A2D; --text2:#3F5B5E; --muted:#6A8285; --line:#D6E5E2; --soft:#F4F9F8;
  --brand:#0B6E74; --brand-2:#07545A; --brand-soft:#DDF0EC; --acc:#2FB597;
  --font:"Manrope",system-ui,sans-serif; --fh:"Manrope",system-ui,sans-serif; --fhw:800; --fls:-.025em;
  --r:20px; --rb:999px; --ri:12px; --ro:16px; --rc:999px; --bw:1px; --cl:var(--line);
  --sh:0 1px 2px rgba(14,42,45,.04),0 12px 32px -14px rgba(14,42,45,.16); --bsh:none;
  --tt:none; --tls:0; --capf:var(--font);
}
html[data-g="salon"]{
  --bg:#F2ECE3; --panel:#FBF8F3; --ink:#1B1714; --text2:#4A423B; --muted:#857A6E; --line:#DCD1C3; --soft:#F5F0E8;
  --brand:#1B1714; --brand-2:#000000; --brand-soft:#E9DFD2; --acc:#A8664F;
  --font:"Jost",system-ui,sans-serif; --fh:"Cormorant Garamond",Georgia,serif; --fhw:500; --fls:0;
  --r:0px; --rb:0px; --ri:0px; --ro:0px; --rc:0px; --bw:1px; --cl:var(--line);
  --sh:none; --bsh:none;
  --tt:uppercase; --tls:.14em; --capf:var(--font);
}
html[data-g="vet"]{
  --bg:#FAF1E2; --panel:#FFFCF6; --ink:#2B2620; --text2:#54493D; --muted:#86786A; --line:#EBDCC6; --soft:#FCF6EC;
  --brand:#C2562A; --brand-2:#9A401C; --brand-soft:#FAE3D3; --acc:#2F5D46;
  --font:"Nunito",system-ui,sans-serif; --fh:"Fredoka","Nunito",sans-serif; --fhw:600; --fls:0;
  --r:22px; --rb:14px; --ri:12px; --ro:18px; --rc:999px; --bw:2px; --cl:#2B2620;
  --sh:4px 4px 0 #2B2620; --bsh:3px 3px 0 #2B2620;
  --tt:none; --tls:0; --capf:var(--fh);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg{flex:none}
h1,h2,h3{font-family:var(--fh);font-weight:var(--fhw);letter-spacing:var(--fls)}

/* barra de crusol (controles del demo) */
.cbar{display:flex;align-items:center;gap:14px;background:var(--cb);color:var(--cb-t);font:12px/1.3 "Geist Mono",ui-monospace,monospace;padding:7px 18px;letter-spacing:.01em}
.cbar b{font-weight:500;color:var(--cb-s);text-transform:uppercase;letter-spacing:.08em}
.cbar .g{display:flex;gap:2px;margin:0 auto;background:rgba(246,245,240,.07);border-radius:6px;padding:2px}
.cbar .g button{border:0;background:transparent;color:rgba(246,245,240,.7);font:inherit;padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.cbar .g button i{width:7px;height:7px;border-radius:50%;display:inline-block}
.cbar .g button[aria-pressed="true"]{background:var(--cb-t);color:var(--cb)}
.cbar .r{white-space:nowrap;color:rgba(246,245,240,.7)}
.cbar .r button{border:0;background:none;color:var(--cb-t);font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.cbar .r a{color:var(--cb-s);text-decoration:none;font-weight:500}

/* encabezado de la empresa */
.app{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--panel);border-bottom:var(--bw) solid var(--cl);position:sticky;top:0;z-index:20}
.mark{width:38px;height:38px;border-radius:var(--rb);background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.app h1{margin:0;font-size:16px;line-height:1.15;white-space:nowrap}
.app h1 small{display:block;font:500 12px/1.3 var(--font);color:var(--muted);letter-spacing:0;text-transform:none}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--soft);border:1px solid var(--line);padding:4px;border-radius:calc(var(--rb) + 4px)}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:var(--rb);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;text-transform:var(--tt);letter-spacing:var(--tls)}
.tab i{font-style:normal;font-weight:500;opacity:.6;margin-left:5px;text-transform:none;letter-spacing:0}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

main{max-width:1320px;margin:0 auto;padding:18px 22px 30px}
.card{background:var(--panel);border:var(--bw) solid var(--cl);border-radius:var(--r);box-shadow:var(--sh)}
.cap{margin:0 0 10px;font:600 11.5px/1.3 var(--capf);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);padding:3px;border-radius:calc(var(--rb) + 3px)}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:var(--rb);font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:var(--bw) solid var(--cl);background:var(--panel);border-radius:var(--rb);padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;text-transform:var(--tt);letter-spacing:var(--tls);box-shadow:var(--bsh);transition:transform .12s,box-shadow .12s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translate(1px,1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#F0C2BD;box-shadow:none}
.btn.bad:hover{background:var(--bad-soft)}
.btn.lnk{border-color:transparent;background:transparent;color:var(--brand);padding-inline:6px;box-shadow:none;text-decoration:underline;text-underline-offset:3px}
.btn svg{width:15px;height:15px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:var(--rc);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.conf{background:var(--ok-soft);color:var(--ok)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.canc{background:#EEEDEA;color:#77736C}
.chip.prog{background:var(--brand-soft);color:var(--brand-2)}

/* ===== portada de reserva ===== */
.hero{position:relative;overflow:hidden;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:28px;align-items:center}
.hero .kick{font:600 12px/1.3 var(--capf);letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.hero h2{margin:10px 0 10px;font-size:40px;line-height:1.04}
.hero p{margin:0;color:var(--text2);font-size:15px;max-width:440px}
.facts{list-style:none;margin:20px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.facts li{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:var(--rc);background:var(--panel);border:1px solid var(--line);color:var(--text2)}
.himg{margin:0;position:relative;height:100%;min-height:250px}
.himg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.himg figcaption{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:8px;background:var(--panel);color:var(--ink);font-size:12.5px;font-weight:700;padding:9px 13px;border-radius:var(--rc);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.himg figcaption i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}

/* ===== reservar ===== */
.bk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.bkm{overflow:hidden}
.bkh{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.bkh h2{margin:0;font-size:20px}
.bkh p{margin:3px 0 16px;color:var(--muted);font-size:13px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps li i{font-style:normal}
.steps li{font-size:12px;font-weight:700;color:#A8A39B;padding-top:9px;border-top:3px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:var(--tt);letter-spacing:var(--tls)}
.steps li.on{color:var(--ink);border-color:var(--brand)}
.steps li.done{color:var(--brand);border-color:var(--brand)}
.bkb{padding:20px 22px 22px;min-height:396px}
.bkb h3{margin:0 0 14px;font-size:17px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--ro);padding:14px 16px;cursor:pointer;position:relative;transition:border-color .15s,box-shadow .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.opt b{font-size:14.5px;font-weight:700}
.opt .s{font-size:12.5px;color:var(--muted)}
.opt .r{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12.5px;color:var(--text2)}
.opt .r strong{color:var(--ink);font-weight:700}
.opt .tag{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-soft);border-radius:var(--rc);padding:2px 8px}
.opt.pro{grid-template-columns:44px minmax(0,1fr);gap:1px 12px;align-items:center}
.opt.pro .av{grid-row:span 3}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av svg{width:20px;height:20px}
.opt .nx{font-size:12px;color:var(--ok);font-weight:700}
.opt .nx.no{color:var(--muted);font-weight:500}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.day{flex:none;width:76px;border:1px solid var(--line);border-radius:var(--ro);background:var(--panel);padding:9px 4px 8px;text-align:center;cursor:pointer;display:grid;gap:0;scroll-snap-align:start}
.day small{font-size:11.5px;color:var(--muted)}
.day b{font:var(--fhw) 21px/1.2 var(--fh)}
.day em{font-style:normal;font-size:11px;color:var(--ok);font-weight:700}
.day:disabled{cursor:not-allowed;background:var(--soft)}
.day:disabled b,.day:disabled em{color:#B2ACA3}
.day[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.day[aria-pressed="true"] small,.day[aria-pressed="true"] em{color:#fff}
.sh{margin:16px 0 8px;font:600 11.5px/1.3 var(--capf);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.sl{border:1px solid var(--line);background:var(--panel);border-radius:var(--ri);padding:10px 4px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.sl:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.sl[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.sl:disabled{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,transparent 6px 12px);color:#B2ACA3;text-decoration:line-through;cursor:not-allowed;font-weight:500}
.hint{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--text2);background:var(--soft);border:1px solid var(--line);border-radius:var(--ri);padding:10px 12px;margin-top:16px}
.hint svg{width:15px;height:15px;margin-top:2px;color:var(--brand)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}

.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--text2);min-width:0}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--ri);padding:11px 12px;font-weight:400;font-size:15px}
.f textarea{resize:vertical;min-height:58px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.err{border-color:var(--bad)!important}
.fx{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-4px 0 14px}
.fx h3{margin:0!important}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--rc);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;background:var(--panel)}
.pill svg{width:15px;height:15px}
.pill[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}
.blk{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.ro{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 10px;align-items:start;border:1px solid var(--line);border-radius:var(--ro);padding:12px 14px;cursor:pointer;font-size:13px;margin-bottom:8px}
.ro input{margin:2px 0 0;accent-color:var(--brand);width:16px;height:16px}
.ro b{font-weight:700}
.ro span{grid-column:2/4;color:var(--muted);font-size:12.5px}
.ro strong{font-weight:700;white-space:nowrap}
.ro.on{border-color:var(--brand);background:var(--brand-soft)}
.chk{display:flex;gap:9px;font-size:13px;align-items:flex-start;margin-top:10px;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:var(--brand);width:16px;height:16px;flex:none}
.chk.err{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

.vp{margin:-6px 0 16px;color:var(--text2);font-size:13.5px;max-width:520px}
.notif{max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 14px 34px -12px rgba(0,0,0,.25);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;animation:nf .45s cubic-bezier(.2,.8,.2,1)}
@keyframes nf{from{opacity:0;transform:translateY(-10px)}}
.notif .nh{display:flex;align-items:center;gap:7px;font-size:12px;color:#667}
.notif .nh b{color:#222;font-weight:600}
.notif .nh span:last-child{margin-left:auto}
.notif .ni{width:20px;height:20px;border-radius:6px;background:#25D366;color:#fff;display:grid;place-items:center}
.notif .ni svg{width:12px;height:12px}
.notif .nb{margin-top:6px;font-size:13.5px;line-height:1.4}
.notif .nb b{display:block;font-weight:600}
.notif .nb strong{font-weight:700;letter-spacing:.08em}
.notif .nsim{display:block;margin-top:8px;padding-top:7px;border-top:1px dashed #ddd;font-size:11px;color:var(--warn);font-weight:600}
.codef{margin-top:18px;max-width:260px}
.f input.code{font:600 26px/1 var(--font);letter-spacing:.42em;text-align:center;padding:12px 8px 12px 18px}
.vrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vrow .btn{padding-left:0}
.btn.lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
.bkn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--panel)}
.bkn .sp{flex:1}

.sum{padding:18px 20px;position:sticky;top:84px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dd.no{color:#B2ACA3;font-weight:500}
.kv .tot{border-top:1px solid var(--line);padding-top:8px}
.pol{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.pol ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:12.5px;color:var(--text2)}
.pol li{display:grid;grid-template-columns:15px 1fr;gap:8px}
.pol li svg{width:14px;height:14px;margin-top:2px;color:var(--brand)}
.sim{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:var(--rc);padding:4px 10px;margin-top:12px}

.done{text-align:center;padding:14px 4px 6px}
.done .ck{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.done .ck.w{background:var(--warn-soft);color:var(--warn)}
.done .ck svg{width:28px;height:28px}
.done h3{font-size:24px!important;margin:0 0 4px!important}
.done>p{margin:0 auto;color:var(--text2);max-width:440px;font-size:13.5px}
.ticket{max-width:430px;margin:18px auto 0;text-align:left;border:var(--bw) solid var(--cl);border-radius:var(--ro);overflow:hidden;background:var(--panel)}
.ticket .th{background:var(--brand);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.ticket .th b{font-size:15px;letter-spacing:.04em}
.ticket .kv{padding:14px 16px}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* ===== agenda ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:13px 16px;min-width:0}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font:var(--fhw) 24px/1.2 var(--fh);letter-spacing:var(--fls)}
.kpi span{font-size:12px;color:var(--muted);margin-left:6px}
.agw{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.ag{overflow:hidden;min-width:0}
.tb{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.nav{display:flex;gap:4px;align-items:center}
.ib{width:32px;height:32px;border:1px solid var(--line);border-radius:var(--rb);background:var(--panel);cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:15px;height:15px}
.ib:hover{border-color:var(--ink)}
.today{height:32px;border:1px solid var(--line);border-radius:var(--rb);background:var(--panel);font-weight:700;font-size:12.5px;padding:0 12px;cursor:pointer}
.dl{font:var(--fhw) 16px/1.2 var(--fh);letter-spacing:var(--fls);white-space:nowrap}
.tb .seg button{padding:5px 10px}
.fils{display:flex;gap:6px;flex-wrap:wrap}
.fil{border:1px solid var(--line);background:var(--panel);border-radius:var(--rc);padding:5px 12px;font-size:12.5px;font-weight:700;color:var(--text2);cursor:pointer;white-space:nowrap}
.fil[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.lg{display:flex;gap:12px;font-size:12px;color:var(--text2);margin-left:auto}
.lg span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}

.ch,.cb{display:grid}
.ch{border-bottom:1px solid var(--line);background:var(--panel)}
.ch>div{padding:9px 10px;min-width:0;border-left:1px solid var(--line);display:flex;align-items:center;gap:9px}
.ch>div:first-child{border-left:0}
.ch .av{width:32px;height:32px;font-size:11px}
.ch b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .wd{display:block;text-align:center;width:100%}
.ch .wd.is b{color:var(--brand)}
.ch .ln{display:flex;justify-content:space-around;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.gut{position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line)}
.off{position:absolute;background:repeating-linear-gradient(135deg,rgba(0,0,0,.035) 0 6px,transparent 6px 12px),var(--soft);display:grid;place-items:center;font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden}
.ev{position:absolute;border:0;border-left:3px solid;border-radius:calc(var(--ri) * .6);padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;cursor:pointer;text-align:left;z-index:2;font-family:var(--font)}
.ev b{display:flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev b svg{width:11px;height:11px}
.ev span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
.ev.conf{background:var(--brand-soft);border-left-color:var(--brand);color:var(--brand-2)}
.ev.pend{background:repeating-linear-gradient(135deg,#FCEFDF 0 7px,#F9E4CB 7px 14px);border-left-color:var(--warn);color:#7A4108}
.ev.canc{background:#F0EFEC;border-left-color:#BDB8B0;color:#9C978F;z-index:1}
.ev.canc b{text-decoration:line-through}
.ev.on{box-shadow:0 0 0 2px var(--ink);z-index:4}
.ev.sm{padding-top:2px;padding-bottom:0}
.ev.xs{padding:2px 4px;text-align:center}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.closed{padding:46px 18px;text-align:center;color:var(--muted)}
.closed b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.lst h4{margin:0;padding:10px 14px 6px;font:600 11.5px/1.3 var(--capf);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}
.li{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:11px 14px;cursor:pointer;position:relative}
.li::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0}
.li.conf::before{background:var(--brand)}
.li.pend::before{background:var(--warn)}
.li.canc::before{background:#BDB8B0}
.li.canc .who{text-decoration:line-through;color:var(--muted)}
.li .tm{grid-row:span 2;font-weight:700;font-size:13px}
.li .tm small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.li .who{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .wh{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chip{grid-row:span 2}

.det{padding:18px 20px;min-width:0}
.det .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.det .fo{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.det h2{margin:2px 0 0;font-size:20px}
.det .pt{font-size:13px;color:var(--text2);margin-top:1px}
.det .kv{margin-top:14px}
.det .acts{display:grid;gap:8px;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.det .acts p{margin:0;font-size:12.5px;color:var(--muted)}
.det .x{display:none;border:0;background:var(--soft);border-radius:var(--rb);width:32px;height:32px;cursor:pointer;place-items:center;padding:0}
.det .x svg{width:16px;height:16px}
.ph{color:var(--muted);text-align:center;padding:30px 8px;font-size:13px}
.ph svg{width:30px;height:30px;color:var(--line);display:block;margin:0 auto 8px}
.scrim{position:fixed;inset:0;background:rgba(16,16,16,.42);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}

/* ===== recordatorios ===== */
.rmw{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;align-items:start}
.rmw>.card{overflow:hidden}
.rmh{padding:16px 18px;border-bottom:1px solid var(--line)}
.rmh h2{margin:0;font-size:18px}
.rmh p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.ri{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--panel);padding:11px 18px;cursor:pointer;position:relative}
.ri:hover{background:var(--soft)}
.ri.on{background:var(--brand-soft)}
.ri.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.ri .tm{grid-row:span 2;font-weight:700;font-size:13px;white-space:nowrap}
.ri .who{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .wh{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.ri .wh svg{width:13px;height:13px}
.ri .wh em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .chip{grid-row:span 2}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 18px;background:var(--soft);border-top:1px solid var(--line)}
.flow div{font-size:12px;color:var(--text2)}
.flow b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:2px}
.pv{padding:16px 18px 20px}
.pvh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tagsim{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:var(--rc);padding:4px 10px}
.tagsim svg,.sim svg{width:13px;height:13px}
.phone{max-width:340px;margin:0 auto;border-radius:30px;border:8px solid #1C2024;background:#ECE5DD;overflow:hidden;box-shadow:0 18px 40px rgba(16,24,40,.14);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wah{background:#1F2C34;color:#E9EDEF;display:flex;align-items:center;gap:10px;padding:10px 12px}
.wah .av{width:34px;height:34px;font-size:12px;background:var(--brand);color:#fff}
.wah .av svg{width:18px;height:18px}
.wah b{display:block;font-size:13.5px;font-weight:600}
.wah small{display:block;font-size:11px;color:#AEBAC1}
.wab{padding:12px 10px 16px;min-height:400px;display:flex;flex-direction:column;gap:7px;background-color:#ECE5DD;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:14px 14px}
.dp{align-self:center;background:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;color:#54656F;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.bub{max-width:88%;background:#fff;border-radius:2px 10px 10px 10px;padding:8px 10px 5px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.08);color:#111B21}
.bub p{margin:0 0 7px}
.bub p:last-of-type{margin-bottom:2px}
.bub time{display:block;text-align:right;font-size:10.5px;color:#8696A0}
.bub.me{align-self:flex-end;background:#D9FDD3;border-radius:10px 2px 10px 10px}
.qr{display:grid;gap:5px;max-width:88%}
.qr button{background:#fff;border:0;border-radius:9px;padding:9px;color:#027EB5;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.qr button:disabled{color:#A9B1BE;cursor:default}
.mail{border:1px solid var(--line);border-radius:var(--ro);overflow:hidden;background:#fff;max-width:420px;margin:0 auto}
.mh{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--text2);display:grid;gap:2px}
.mh b{color:var(--ink);font-weight:700}
.mtop{background:var(--brand);color:#fff;padding:16px 18px;display:flex;align-items:center;gap:10px}
.mtop .mark{background:rgba(255,255,255,.16);width:32px;height:32px}
.mtop .mark svg{width:18px;height:18px}
.mtop b{font:var(--fhw) 16px/1.2 var(--fh)}
.mb{padding:18px;font-size:13.5px;color:var(--text2)}
.mb p{margin:0 0 12px}
.mb .kv{background:var(--soft);border:1px solid var(--line);border-radius:var(--ri);padding:12px 14px;margin:0 0 14px}
.mb .row{display:flex;gap:8px;flex-wrap:wrap}
.mb .ft{font-size:11.5px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:var(--ri);font-size:13px;opacity:0;transition:opacity .25s,transform .25s;z-index:60;max-width:min(92vw,520px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Dental: clínico y luminoso ===== */
html[data-g="dental"] .app{border-bottom:1px solid var(--line)}
html[data-g="dental"] .mark{border-radius:14px;background:linear-gradient(140deg,var(--acc),var(--brand))}
html[data-g="dental"] .hero{background:linear-gradient(120deg,#DCF1EC 0%,#F6FBFA 60%);border-radius:28px;padding:10px 10px 10px 40px;border:1px solid var(--line)}
html[data-g="dental"] .hero h2{color:var(--ink)}
html[data-g="dental"] .himg{min-height:290px}
html[data-g="dental"] .himg img{border-radius:22px}
html[data-g="dental"] .tabs{background:#E6F2F0;border-color:transparent}

/* ===== Salón: editorial ===== */
html[data-g="salon"] body{font-size:14.5px}
html[data-g="salon"] .app{padding:16px 22px;border-bottom:1px solid var(--ink)}
html[data-g="salon"] .mark{display:none}
html[data-g="salon"] .app h1{font:500 26px/1 var(--fh);letter-spacing:.18em;text-transform:uppercase}
html[data-g="salon"] .app h1 small{letter-spacing:.2em;text-transform:uppercase;font-size:10.5px;margin-top:6px}
html[data-g="salon"] .tabs{background:none;border:0;padding:0;gap:22px}
html[data-g="salon"] .tab{padding:6px 0;font-size:12px;font-weight:500}
html[data-g="salon"] .tab[aria-selected="true"]{background:none;box-shadow:inset 0 -1px 0 var(--ink)}
html[data-g="salon"] .hero{display:block;min-height:340px;color:#F2ECE3;text-align:center}
html[data-g="salon"] .himg{position:absolute;inset:0;min-height:0}
html[data-g="salon"] .himg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,13,.25),rgba(20,16,13,.7))}
html[data-g="salon"] .himg figcaption{display:none}
html[data-g="salon"] .htx{position:relative;z-index:2;padding:64px 24px 54px;display:flex;flex-direction:column;align-items:center}
html[data-g="salon"] .hero .kick{color:#E7D5C2;font-weight:500;letter-spacing:.3em}
html[data-g="salon"] .hero h2{font-size:64px;font-style:italic;line-height:.95;margin:16px 0 14px}
html[data-g="salon"] .hero p{color:rgba(242,236,227,.85);margin:0 auto}
html[data-g="salon"] .facts{justify-content:center}
html[data-g="salon"] .facts li{background:none;border-color:rgba(242,236,227,.4);color:#F2ECE3;font-weight:500;letter-spacing:.06em}
html[data-g="salon"] .bkh h2,html[data-g="salon"] .rmh h2{font-size:28px;font-style:italic}
html[data-g="salon"] .bkb h3{font-size:26px;font-style:italic;font-weight:500}
html[data-g="salon"] .done h3{font-size:34px!important;font-style:italic}
html[data-g="salon"] .det h2{font-size:26px;font-style:italic}
html[data-g="salon"] .opt b{font:500 21px/1.15 var(--fh)}
html[data-g="salon"] .opt[aria-pressed="true"]{box-shadow:none;background:var(--ink);color:var(--panel);border-color:var(--ink)}
html[data-g="salon"] .opt[aria-pressed="true"] .s,html[data-g="salon"] .opt[aria-pressed="true"] .r,html[data-g="salon"] .opt[aria-pressed="true"] .r strong{color:var(--panel)}
html[data-g="salon"] .av{border-radius:0;background:var(--ink);color:var(--panel);font-weight:500;letter-spacing:.08em}
html[data-g="salon"] .btn{font-weight:500;font-size:12px;padding:12px 22px}
html[data-g="salon"] .day b{font-size:26px;font-weight:500}
html[data-g="salon"] .sl{font-weight:500}
html[data-g="salon"] .kpi b{font-size:32px;font-weight:500}
html[data-g="salon"] .dl{font-size:22px;font-style:italic}
html[data-g="salon"] .chip{text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;font-weight:600}
html[data-g="salon"] .chip.conf{background:none;border:1px solid var(--ok)}
html[data-g="salon"] .chip.pend{background:none;border:1px solid var(--warn)}
html[data-g="salon"] .chip.canc{background:none;border:1px solid #BDB8B0}
html[data-g="salon"] .chip.prog{background:none;border:1px solid var(--ink);color:var(--ink)}
html[data-g="salon"] .ev.conf{background:#EDE4D7;color:var(--ink)}
html[data-g="salon"] .ticket .th{background:var(--ink)}
html[data-g="salon"] .steps li{font-size:11px}

/* ===== Veterinaria: cálido y amable ===== */
html[data-g="vet"] .app{border-bottom:2px solid var(--ink)}
html[data-g="vet"] .mark{border-radius:50%;border:2px solid var(--ink)}
html[data-g="vet"] .app h1{font-size:18px}
html[data-g="vet"] .tabs{background:var(--panel);border:2px solid var(--ink);border-radius:18px}
html[data-g="vet"] .tab{border-radius:12px;font-weight:700}
html[data-g="vet"] .tab[aria-selected="true"]{background:var(--ink);color:var(--panel);box-shadow:none}
html[data-g="vet"] .hero{background:#F3C969;border:2px solid var(--ink);border-radius:30px;box-shadow:var(--sh);padding:30px 34px}
html[data-g="vet"] .hero::before{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:#EFB247}
html[data-g="vet"] .hero>*{position:relative}
html[data-g="vet"] .hero .kick{color:var(--acc)}
html[data-g="vet"] .hero h2{font-size:42px}
html[data-g="vet"] .hero p{color:#4A3F33}
html[data-g="vet"] .facts li{border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-weight:700}
html[data-g="vet"] .facts li:first-child{background:var(--acc);color:#fff}
html[data-g="vet"] .himg{min-height:260px}
html[data-g="vet"] .himg img{border:2px solid var(--ink);border-radius:58% 42% 50% 50% / 52% 48% 52% 48%}
html[data-g="vet"] .himg figcaption{border:2px solid var(--ink);box-shadow:var(--bsh);transform:rotate(-3deg);left:auto;right:6px;bottom:8px}
html[data-g="vet"] .opt,html[data-g="vet"] .day,html[data-g="vet"] .sl,html[data-g="vet"] .ro,html[data-g="vet"] .pill,html[data-g="vet"] .fil,html[data-g="vet"] .f input,html[data-g="vet"] .f select,html[data-g="vet"] .f textarea{border-width:2px}
html[data-g="vet"] .opt[aria-pressed="true"]{box-shadow:var(--bsh);border-color:var(--ink);background:var(--brand-soft)}
html[data-g="vet"] .day[aria-pressed="true"],html[data-g="vet"] .sl[aria-pressed="true"]{border-color:var(--ink);box-shadow:var(--bsh)}
html[data-g="vet"] .btn.pri{border-color:var(--ink)}
html[data-g="vet"] .btn.ok{border-color:var(--ink);box-shadow:var(--bsh)}
html[data-g="vet"] .av{background:#F3C969;color:var(--ink);border:2px solid var(--ink)}
html[data-g="vet"] .ch .av{border-width:2px}
html[data-g="vet"] .ev{border:2px solid var(--ink);border-left-width:2px;border-radius:10px}
html[data-g="vet"] .ev.conf{background:#FBE9DC;color:var(--ink)}
html[data-g="vet"] .ev.canc{border-color:#C9BFB2}
html[data-g="vet"] .ticket .th{border-bottom:2px solid var(--ink)}
html[data-g="vet"] .chip{border:1.5px solid currentColor}
html[data-g="vet"] .kpi b{font-size:26px}

@media (max-width:1100px){.rmw{grid-template-columns:minmax(0,1fr) 380px}}
@media (max-width:1000px){
  .bk,.agw,.rmw{grid-template-columns:minmax(0,1fr)}
  .sum{position:static}
  .sum.fin{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  html[data-g="dental"] .hero{padding:26px 22px 10px}
  html[data-g="dental"] .himg{min-height:200px;margin:0 -12px}
  .det{position:fixed;left:0;right:0;bottom:0;z-index:40;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(16,24,40,.18)}
  .det.open{transform:none}
  .det .x{display:grid}
  .det.idle{display:none}
}
@media (max-width:760px){
  .cbar{flex-wrap:wrap;gap:6px 10px;padding:7px 14px;justify-content:space-between}
  .cbar .g{order:3;width:100%;margin:0}
  .cbar .g button{flex:1;justify-content:center;padding:7px 4px}
  .app{flex-wrap:wrap;gap:10px 12px;padding:12px 14px;position:static}
  .tabs{margin-left:0;width:100%}
  .tab{flex:1;padding:9px 6px}
  .tab i{display:none}
  html[data-g="salon"] .app{justify-content:center;text-align:center}
  html[data-g="salon"] .app h1{font-size:22px}
  html[data-g="salon"] .tabs{justify-content:center;gap:18px}
  html[data-g="salon"] .tab{flex:none}
  main{padding:12px 12px 24px}
  .hero h2{font-size:30px}
  html[data-g="salon"] .hero{min-height:0}
  html[data-g="salon"] .hero h2{font-size:44px}
  html[data-g="salon"] .htx{padding:46px 18px 40px}
  html[data-g="vet"] .hero{padding:24px 20px}
  html[data-g="vet"] .hero h2{font-size:32px}
  html[data-g="vet"] .himg{min-height:200px}
  .bkh{padding:16px 16px 12px}
  .bkb{padding:16px;min-height:0}
  .bkn{padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 18px rgba(16,24,40,.07)}
  .bkn .btn{padding:12px 16px;font-size:14px}
  .opts,.fg{grid-template-columns:minmax(0,1fr)}
  .steps li{font-size:11px}
  .steps li i{font-style:normal}
  .steps li:not(.on) span{display:none}
  .steps{display:flex}
  .steps li{flex:0 0 30px}
  .steps li.on{flex:1 1 auto}
  html[data-g="salon"] .steps li{font-size:10px;letter-spacing:.02em}
  .sg{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sl{padding:12px 4px}
  .tb{gap:8px}
  .tb .dl{order:-1;width:100%}
  .tb .seg{margin-left:auto}
  .fils{width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .lg{display:none}
  .kpi b{font-size:20px}
  html[data-g="salon"] .kpi b{font-size:26px}
  .kpi span{display:block;margin:0}
  .flow{grid-template-columns:minmax(0,1fr)}
